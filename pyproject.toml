[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-local"
version = "0.1.0"
description = "Secure local foundation for the SŪTRA runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
    "websockets>=14,<16",
    "PyYAML>=6.0",
    "rich>=13.0.0,<14",
    "keyring>=24.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
dev = ["cryptography>=42,<47"]

[project.scripts]
sutra = "sutra.cli:main"

[tool.setuptools.packages.find]
include = ["sutra*"]
